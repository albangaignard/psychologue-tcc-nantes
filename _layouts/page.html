---
layout: default
---

<div class="page-header">
  <div class="container">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</section>
